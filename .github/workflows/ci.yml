name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the one before it; nothing is learned from finishing a
# run against a commit that is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Attached to every error report and RUM beacon, so a metric can be traced back
  # to the commit that produced it.
  NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}

jobs:
  verify:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  budgets:
    name: Build and first-load JS budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fails the build when a route goes over its budget, which is the only way
      # a budget stays a budget rather than an aspiration.
      - run: npm run check:bundle -- --strict
      - name: Record the measured sizes
        if: always()
        run: npm run check:bundle -- --json > bundle-sizes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-sizes
          path: bundle-sizes.json

  e2e:
    name: End-to-end (production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds and starts the production server itself, and
      # refuses to reuse an existing one under CI.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
